<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buchudômetro — Placar Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt: #123c2f;
    --felt-dark: #0b2c22;
    --felt-line: rgba(255,255,255,0.06);
    --chalk: #f3efe2;
    --chalk-dim: #b9c9c0;
    --tile: #faf7ef;
    --tile-ink: #201d18;
    --gold: #d99a3d;
    --gold-dark: #b87c28;
    --danger: #c0524a;
    --whatsapp: #25d366;
    --whatsapp-dark: #1da851;
    --radius: 16px;
    --shadow: 0 6px 18px rgba(0,0,0,0.28);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: radial-gradient(120% 140% at 50% -10%, #1a5240 0%, var(--felt) 45%, var(--felt-dark) 100%);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      radial-gradient(120% 140% at 50% -10%, #1a5240 0%, var(--felt) 45%, var(--felt-dark) 100%),
      repeating-linear-gradient(45deg, var(--felt-line) 0, var(--felt-line) 1px, transparent 1px, transparent 14px);
    padding-bottom: 96px; /* espaço pro botão fixo do WhatsApp */
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 20px;
  }

  header{
    text-align:center;
    margin-bottom: 22px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 4px;
  }

  h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 46px;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1;
    color: var(--chalk);
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  .subtitle{
    color: var(--chalk-dim);
    font-size: 13px;
    margin-top: 6px;
  }

  #status-banner{
    display:none;
    background: rgba(192,82,74,0.15);
    border: 1px solid var(--danger);
    color: #ffd9d6;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  #status-banner.show{ display:block; }
  #status-banner code{
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 4px;
  }

  #sync-indicator{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--chalk-dim);
    margin-bottom: 18px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--chalk-dim);
  }
  #sync-indicator.online .dot{ background: var(--whatsapp); box-shadow:0 0 6px var(--whatsapp); }
  #sync-indicator.online { color: var(--chalk); }

  .ranking{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .tile{
    position: relative;
    background: var(--tile);
    color: var(--tile-ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 3px solid #1a1712;
    overflow:hidden;
    transition: transform .15s ease;
  }
  .tile.bump{ animation: bump .35s ease; }
  @keyframes bump{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.02); }
    100%{ transform: scale(1); }
  }

  .tile-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 16px 10px;
  }

  .rank-badge{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6b675e;
  }

  .player-name{
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.2px;
  }

  .leader-mark{
    font-size: 15px;
  }

  .tile-groove{
    height: 3px;
    margin: 0 10%;
    background: rgba(26,23,18,0.14);
    border-radius: 2px;
  }

  .tile-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 14px 14px 16px;
  }

  .count-wrap{
    display:flex;
    align-items:baseline;
    gap: 6px;
  }

  .count{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 34px;
    line-height:1;
  }
  .count-label{
    font-size: 11px;
    color:#6b675e;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn-group{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .btn-add, .btn-remove{
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 700;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease;
  }
  .btn-add:active, .btn-remove:active{ transform: scale(0.9); }
  .btn-add:disabled, .btn-remove:disabled{ opacity:0.4; cursor:default; }

  .btn-add{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--gold), var(--gold-dark));
    color: #241a08;
    font-size: 26px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }

  .btn-remove{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(32,29,24,0.08);
    border: 2px solid rgba(32,29,24,0.25);
    color: #4a453b;
    font-size: 20px;
    box-shadow: none;
  }

  .empty-state{
    text-align:center;
    color: var(--chalk-dim);
    font-size: 14px;
    padding: 30px 10px;
  }

  footer{
    position: fixed;
    left:0; right:0; bottom:0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--felt-dark) 60%, transparent);
  }

  .btn-whatsapp{
    max-width: 480px;
    margin: 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(160deg, var(--whatsapp), var(--whatsapp-dark));
    color: #06210f;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-whatsapp:active{ transform: translateY(1px); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Placar Oficial</p>
    <h1>Buchudômetro</h1>
    <p class="subtitle">Campeonato de Dominó — buchudas em tempo real</p>
  </header>

  <div id="status-banner"></div>

  <div id="sync-indicator">
    <span class="dot"></span>
    <span id="sync-text">Conectando…</span>
  </div>

  <main class="ranking" id="ranking">
    <!-- Os cards dos jogadores são renderizados aqui via JavaScript -->
  </main>
</div>

<footer>
  <button class="btn-whatsapp" id="btn-whatsapp">
    📲 Enviar ranking no WhatsApp
  </button>
</footer>

<script type="module">
  // ============================================================
  // 1) LISTA DE JOGADORES — EDITE AQUI OS NOMES DO SEU CAMPEONATO
  // ============================================================
  const PLAYERS = [
    "Biro",
    "Victor",
    "Igor",
    "Guilherme",
    "Kauã",
    "Hilário",
    "Marcos",
    "Erinaldo",
    "Gênessis",
    "Davy",
    "Gedean",
    "Tão toma",
    "Yamal",
    "André",
    "Edes Mateus",
    "Wendell",
    "Thomas",
    "Fofalete"
    "Diogo Adler"
  ];

  // ============================================================
  // 2) CREDENCIAIS DO FIREBASE — COLE SUA firebaseConfig AQUI
  //    (veja o Tutorial Parte 1 para saber onde encontrar isso)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyD-B7GxGKHRjZ3dQHQlx2cUW_oDHu4kjkI",
    authDomain: "gratuito-ae8cf.firebaseapp.com",
    databaseURL: "https://gratuito-ae8cf-default-rtdb.firebaseio.com",
    projectId: "gratuito-ae8cf",
    storageBucket: "gratuito-ae8cf.firebasestorage.app",
    messagingSenderId: "364046937539",
    appId: "1:364046937539:web:fe554c772d1ee100ce2176"
  };
  // ============================================================

  const rankingEl = document.getElementById('ranking');
  const syncIndicator = document.getElementById('sync-indicator');
  const syncText = document.getElementById('sync-text');
  const statusBanner = document.getElementById('status-banner');
  const btnWhatsapp = document.getElementById('btn-whatsapp');

  let currentData = {};

  function showBanner(html){
    statusBanner.innerHTML = html;
    statusBanner.classList.add('show');
  }

  const configPreenchida = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("COLE_AQUI");

  if (!configPreenchida) {
    syncText.textContent = "Aguardando configuração";
    showBanner(
      "⚠️ O Firebase ainda não foi configurado. Cole os dados do seu projeto " +
      "dentro do objeto <code>firebaseConfig</code> no arquivo <code>index.html</code> " +
      "(veja o Tutorial Parte 1)."
    );
    renderPlaceholder();
  } else {
    iniciarApp();
  }

  async function iniciarApp(){
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const {
        getDatabase, ref, onValue, update, get, increment
      } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const buchudasRef = ref(db, 'buchudas');

      // Garante que todo jogador da lista PLAYERS exista no banco,
      // sem sobrescrever contagens já existentes.
      const snapshotInicial = await get(buchudasRef);
      const dadosAtuais = snapshotInicial.exists() ? snapshotInicial.val() : {};
      const faltantes = {};
      PLAYERS.forEach(nome => {
        if (!(nome in dadosAtuais)) faltantes[nome] = 0;
      });
      if (Object.keys(faltantes).length > 0) {
        await update(buchudasRef, faltantes);
      }

      // Listener em tempo real: qualquer alteração no banco
      // atualiza a tela na hora, para todo mundo que estiver com o link aberto.
      onValue(buchudasRef, (snapshot) => {
        currentData = snapshot.val() || {};
        syncIndicator.classList.add('online');
        syncText.textContent = "Sincronizado em tempo real";
        statusBanner.classList.remove('show');
        render();
      }, (error) => {
        console.error(error);
        syncIndicator.classList.remove('online');
        syncText.textContent = "Erro de conexão";
        showBanner(
          "❌ Não foi possível conectar ao Firebase. Confira se as " +
          "<b>regras do banco</b> permitem leitura/escrita e se os dados de " +
          "<code>firebaseConfig</code> estão corretos."
        );
      });

      window.__ajustarBuchuda = (nome, delta) => {
        const valorAtual = currentData[nome] || 0;
        if (delta < 0 && valorAtual <= 0) return; // não deixa ficar negativo
        update(buchudasRef, { [nome]: increment(delta) });
      };

    } catch (err) {
      console.error(err);
      syncText.textContent = "Erro ao carregar Firebase";
      showBanner("❌ Erro ao inicializar o Firebase: " + err.message);
    }
  }

  function render(){
    const ordenadoPorRanking = [...PLAYERS].sort(
      (a, b) => (currentData[b] || 0) - (currentData[a] || 0)
    );
    const maiorValor = Math.max(0, ...PLAYERS.map(p => currentData[p] || 0));

    rankingEl.innerHTML = '';

    if (PLAYERS.length === 0) {
      rankingEl.innerHTML = '<p class="empty-state">Nenhum jogador cadastrado ainda.</p>';
      return;
    }

    ordenadoPorRanking.forEach((nome, index) => {
      const valor = currentData[nome] || 0;
      const ehLider = valor === maiorValor && valor > 0;

      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.player = nome;
      tile.innerHTML = `
        <div class="tile-top">
          <span class="player-name">${escapeHtml(nome)} ${ehLider ? '<span class="leader-mark">🐔</span>' : ''}</span>
          <span class="rank-badge">#${index + 1}</span>
        </div>
        <div class="tile-groove"></div>
        <div class="tile-bottom">
          <div class="count-wrap">
            <span class="count">${valor}</span>
            <span class="count-label">buchuda${valor === 1 ? '' : 's'}</span>
          </div>
          <div class="btn-group">
            <button class="btn-remove" data-player="${escapeHtml(nome)}" data-delta="-1" ${configPreenchida ? '' : 'disabled'} aria-label="Remover buchuda de ${escapeHtml(nome)}">−</button>
            <button class="btn-add" data-player="${escapeHtml(nome)}" data-delta="1" ${configPreenchida ? '' : 'disabled'} aria-label="Adicionar buchuda para ${escapeHtml(nome)}">+</button>
          </div>
        </div>
      `;
      rankingEl.appendChild(tile);
    });

    rankingEl.querySelectorAll('.btn-add, .btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const nome = btn.dataset.player;
        const delta = parseInt(btn.dataset.delta, 10);
        const tile = btn.closest('.tile');
        tile.classList.remove('bump');
        void tile.offsetWidth; // reinicia a animação
        tile.classList.add('bump');
        if (window.__ajustarBuchuda) window.__ajustarBuchuda(nome, delta);
      });
    });
  }

  function renderPlaceholder(){
    rankingEl.innerHTML = PLAYERS.map(nome => `
      <div class="tile">
        <div class="tile-top">
          <span class="player-name">${escapeHtml(nome)}</span>
        </div>
        <div class="tile-groove"></div>
        <div class="tile-bottom">
          <div class="count-wrap">
            <span class="count">0</span>
            <span class="count-label">buchudas</span>
          </div>
          <div class="btn-group">
            <button class="btn-remove" disabled>−</button>
            <button class="btn-add" disabled>+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Botão do WhatsApp: monta o ranking atual e abre o link de compartilhamento
  btnWhatsapp.addEventListener('click', () => {
    const ordenado = [...PLAYERS].sort(
      (a, b) => (currentData[b] || 0) - (currentData[a] || 0)
    );

    if (!configPreenchida || ordenado.every(p => !(p in currentData))) {
      alert("Configure o Firebase primeiro para poder compartilhar o ranking real.");
      return;
    }

    const medalhas = ['🥇', '🥈', '🥉'];
    let texto = "🁢 *Ranking de Buchudas do Campeonato* 🁢\n\n";
    ordenado.forEach((nome, i) => {
      const valor = currentData[nome] || 0;
      const prefixo = medalhas[i] || `${i + 1}º`;
      texto += `${prefixo} ${nome} — ${valor} buchuda${valor === 1 ? '' : 's'}\n`;
    });
    texto += "\n_Atualizado automaticamente pelo Buchudômetro 🁢_";

    const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
